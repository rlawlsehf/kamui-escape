name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with build.sh
        run: |
          chmod +x build.sh
          ./build.sh CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p release
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
          if [ -d "$APP_PATH" ] && [ ! -f release/*.ipa ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r release/kamui-escape-unsigned.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: release/*.ipa

        
