name: Build Unsigned IPA

on:
  workflow_dispatch: # 수동 빌드 버튼 활성화

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with build.sh
        run: |
          chmod +x build.sh
          # 서명 없이 빌드 수행
          ./build.sh CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA (If build.sh didn't create IPA)
        run: |
          # build.sh 실행 후 release 폴더에 ipa가 이미 존재하면 패스, 
          # .app만 생성된 경우 IPA 구조로 강제 압축
          mkdir -p release
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
          if [ -d "$APP_PATH" ] && [ ! -f release/*.ipa ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r release/kamui-escape-unsigned.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: release/*.ipa
